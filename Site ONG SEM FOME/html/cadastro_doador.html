    <main class="content">
  <section class="bloco-home maxw-820">
  <h1 class="titulo-pagina mt-0">Cadastro de Doador</h1>
        <p class="descricao-pagina">
          Preencha os dados abaixo para realizar seu cadastro como doador.
        </p>

        <form
          id="formCadastroDoador"
          class="form-adicionar form-grid"
          
        >
          <div class="form-field">
            <label for="nome">Nome completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex.: Maria da Silva"
              required
            />
          </div>
          <div class="form-field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
            />
          </div>
          <div class="form-field">
            <label for="telefone">Telefone/WhatsApp</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(11) 90000-0000"
              required
            />
          </div>
          <div class="form-field">
            <label for="cpfCnpj">CPF ou CNPJ</label>
            <input
              type="text"
              id="cpfCnpj"
              name="cpfCnpj"
              placeholder="Somente números"
              required
            />
          </div>
          <div class="form-field">
            <label for="senha">Senha</label>
            <input
              type="text"
              id="senha"
              name="senha"
              placeholder="Crie uma senha"
              required
            />
          </div>
          <div
            class="form-actions"
            class="full-width-field justify-end"
          >
            <button type="submit" class="btn-primary">Salvar Cadastro</button>
            <button class="btn-secondary" type="button" id="btnCancelar">Cancelar</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="rodape">

  </body>
