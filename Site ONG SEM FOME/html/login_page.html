<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Login - ONG SEM FOME</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="pagina-login">
    <header class="site-header">
      <nav class="navbar">
        <div class="navbar-item">
          <div class="brand">
            <h2 class="brand-title"><a href="index.html">SEM FOME</a></h2>
          </div>
        </div>
        <div class="navbar-item">
          <ul class="menu-principal">
            <li class="ativo"><a href="index.html">Home</a></li>
            <li><a href="index.html#sobre">Sobre</a></li>
            <li><a href="index.html#ajudar">Como Ajudar</a></li>
            <li><a href="index.html#transparencia">Transparência</a></li>
            <li><a href="index.html#contato">Contato</a></li>
            <li><a href="cadastro_doador.html">Doe</a></li>
          </ul>
        </div>
        <div class="navbar-item">
          <div class="navbar-login">
            <a href="login_page.html" class="btn-login" role="button">Login</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="content">
      <section class="login-box">
        <div class="form-adicionar">
          <h2 class="login-title">Entrar na área administrativa</h2>
          <p class="login-subtitle">
            Digite seu usuário e senha para acessar o sistema.
          </p>
          <form id="loginForm" class="login-form">
            <div class="login-fields">
              <label for="email">Usuário</label>
              <input type="text" id="email" name="email" required />
              <label for="password">Senha</label>
              <div class="input-with-icon">
                <input type="password" id="password" name="password" required />
                <button
                  type="button"
                  id="togglePassword"
                  class="icon-button"
                  aria-label="Mostrar senha"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
              <div class="login-actions">
                <button type="submit" class="btn-primary btn-cadastro">
                  Entrar
                </button>
                <a href="index.html" class="btn-secondary btn-back">Voltar</a>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="rodape">
      © 2025 ONG SEM FOME. Todos os direitos reservados.
    </footer>

    <script src="/js/login.js"></script>
  </body>
</html>
